[versions]
# --- Core & Plugins ---
agp = "8.12.3"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.2"
googleServices = "4.4.3"
crashlytics = "3.0.6"
# --- Jetpack Compose & UI ---
activityCompose = "1.11.0"
composeBom = "2025.09.01"
coreSplashScreen = "1.0.1"
material = "1.13.0"
androidxNavigationCompose = "2.9.5"
uiTooling = "1.9.2"
# --- AndroidX Core & Lifecycle ---
appcompat = "1.7.1"
coreKtx = "1.17.0"
androidxLifecycle = "2.9.4"
# --- Dependency Injection ---
hilt = "2.57.2"
androidxHiltNavigationCompose = "1.3.0"
javaxInject = "1"
# --- Coroutines ---
kotlinxCoroutines = "1.10.2"
# --- DataStore ---
androidxDatastore = "1.1.7"
# --- Serialization ---
kotlinxSerialization = "1.9.0"
# --- Firebase ---
firebaseBom = "34.3.0"
# --- Testing ---
espressoCore = "3.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
mockito = "5.20.0"
mockitoInline = "5.+"
mockito-kotlin = "6.1.0"
byteBuddyAgent = "1.17.7"
jacoco = "0.8.12"
coreKtxVersion = "1.7.0"
turbine = "1.2.1"
truth = "1.4.5"
okHttp = "5.2.0"

[libraries]
# --- AndroidX Core & AppCompat ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# --- AndroidX Lifecycle ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
# --- Jetpack Compose ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# --- AndroidX Navigation ---
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigationCompose" }
# --- Dependency Injection (Hilt & Javax) ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigationCompose" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
# --- Coroutines ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# --- DataStore ---
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "androidxDatastore" }
# --- Serialization ---
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# --- UI Components (Material & Splash Screen) ---
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashScreen" }
# --- Firebase ---
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
# --- Google Services ---
androidx-google-signin = { group = "com.google.android.gms", name = "play-services-auth" }
# --- Testing ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
byte-buddy-agent = { group = "net.bytebuddy", name = "byte-buddy-agent", version.ref = "byteBuddyAgent" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "uiTooling" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockitoInline" }
core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "coreKtxVersion" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
google-truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okHttp" }

[bundles]
# --- Bundle Definitions ---
compose = ["androidx-activity-compose", "androidx-ui", "androidx-ui-graphics", "androidx-ui-tooling-preview", "androidx-material3"]
lifecycle = ["androidx-lifecycle-runtime-ktx", "androidx-lifecycle-viewmodel-ktx", "androidx-lifecycle-viewmodel-compose", "androidx-lifecycle-runtime-compose"]
firebase = ["firebase-auth", "firebase-firestore", "firebase-analytics", "firebase-crashlytics"]
testing-android = ["androidx-junit", "androidx-espresso-core", "hilt-testing", "kotlinx-coroutines-test", "google-truth", "okhttp"]
testing-domain = ["junit", "mockito-core", "mockito-kotlin", "kotlinx-coroutines-test"]
testing-data = ["junit", "mockito-kotlin", "kotlinx-coroutines-test", "mockito-inline"]
mockito-test = ["mockito-core", "mockito-kotlin"]

[plugins]
# --- Android & Kotlin ---
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# --- Code Generation & DI ---
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# --- Firebase ---
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
# --- Serialization ---
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }